<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1420" />
    <title>퇴근 서바이버</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1420;
        overflow: hidden;
        /* 휴대폰에서 스크롤·확대·길게 누르기 메뉴가 끼어들지 않게 */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 크기와 위치는 main.js가 실제 보이는 영역에 맞춰 정한다 */
      #game {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
      }
      #rotate-hint {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #1a1420;
        color: #ffd23f;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        font-size: 18px;
        text-align: center;
        z-index: 10;
      }
      #rotate-hint[hidden] {
        display: none;
      }
      #rotate-hint .icon {
        font-size: 40px;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint" hidden>
      <div class="icon">↻</div>
      <div id="rotate-text">휴대폰을 가로로 돌려주세요</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
